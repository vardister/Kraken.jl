# Creates the git tag and GitHub Release for a version once JuliaRegistrator has registered it in
# General. Through v0.2.3 the tags were pushed by hand and no release notes accompanied them; this
# keeps the two in step. TagBot only acts on comments from the JuliaTagBot account, or on a manual
# dispatch, so it is inert otherwise.
name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  discussions: read
  issues: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
