name: Format

on:
  push:
    branches: [master, revival]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install JuliaFormatter
        # Pinned to the major version the repo was formatted with. JuliaFormatter changes its
        # output between majors, so an unpinned install turns this job into a random failure.
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2"))'
      - name: Check formatting
        # The check lives in .github/format_check.jl so YAML and shell quoting cannot mangle it.
        # Run the same thing locally with: julia .github/format_check.jl
        run: julia .github/format_check.jl
