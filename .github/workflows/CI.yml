name: CI

on:
  push:
    branches: [master, revival]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A new push supersedes the previous one instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The full suite took 28-42 min on macOS runners by 2026-09 and outgrew 45 with Milestones 6-8;
    # most of it is AD compilation (see test/README.md). 75 leaves room without hiding a hang.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # "1.10" is the declared lower bound in Project.toml and must actually be exercised —
        # developing on 1.12 while claiming 1.10 is how the bound silently rots. "lts" and "1"
        # track whatever Julia currently calls long-term-support and latest-stable, so the matrix
        # keeps meaning the same thing as those move.
        version: ["1.10", "lts", "1"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Runs Pkg.test() from the root environment, which is what picks up test/Project.toml as the
      # test environment. See test/README.md for why --project=test is wrong here.
      #
      # KRAKEN_RUN_KNOWN_LIMITATIONS turns on the tripwire testsets that assert a *current*
      # limitation still holds — today just the one for Mooncake's complex-arithmetic failure. They
      # are skipped by default because ~45 s to confirm nothing has changed is not worth paying on
      # every local run, but the whole point of a tripwire is that CI trips it.
      - uses: julia-actions/julia-runtest@v1
        env:
          KRAKEN_RUN_KNOWN_LIMITATIONS: "true"

  # Benchmarks are opt-in and timing-sensitive, so they run once rather than across the matrix.
  # Thresholds are set to catch order-of-magnitude regressions, not to police CI runner variance.
  performance:
    name: Performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 75   # the full suite plus the benchmarks; see the test job's note
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          KRAKEN_RUN_PERFORMANCE_TESTS: "true"

  # Every script in examples/ runs to the end. They are what a new user copies from, and before plan
  # task 8.3 five of the seven called an API that had been removed, with nothing to notice. They have
  # their own environment (examples/Project.toml, which points Kraken at this checkout through
  # `[sources]`, hence Julia 1.11+ here). The scripts assert their own results as they go, so a run
  # that finishes is a run that passed.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Instantiate examples environment
        run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'
      - name: Run every example
        run: |
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=examples --threads=auto "$f"
            echo "::endgroup::"
          done
